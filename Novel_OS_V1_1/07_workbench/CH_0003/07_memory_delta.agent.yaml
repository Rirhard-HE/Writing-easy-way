    proposed: 墓灯
    status: AUTHOR_APPROVED
  summary:
    - CHR_0002 shows CHR_0001 a reconstructed residual route from the accident region toward LOC_0002
    - FAC_0001 asks CHR_0001 to lead FAC_0004 back to the accident region and onward into unknown space
    - FAC_0004 is an old but carefully maintained and fully armed expedition fleet with two cruiser-class hulls
    - FAC_0001 offers debt and clone-fee cancellation, FAC_0002 candidate status, and SYS_0007 access if sufficient information is returned
    - ITEM_0001 presents an L3 model that CHR_0001's return should not have survived the suspected erasure effect
    - FAC_0001 records CHR_0001's return structure integrity as 92.7 percent and suspects the target saw and deliberately spared him

