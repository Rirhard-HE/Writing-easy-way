world_changes:
  LOC_0002:
    stable_author_facts:
      - dangerous dust-filled region
      - organized around or prominently contains a late-life star
      - heavy dust obscures visible-light observation
    organization_model:
      - the star is undergoing continuing mass loss
      - infrared and thermal mapping reveal a bright core, shells, and arcs within the dust
      - local dust and hot regions interfere with navigation and observation
    exact_coordinates: UNRESOLVED
    exact_stellar_class: UNRESOLVED
    objective_internal_structure: UNRESOLVED
  FAC_0004:
    composition:
      - one old combat cruiser
      - several escort frigates
      - engineering ships
      - one cruiser-class supply carrier
    state:
      - old and repeatedly rebuilt
      - carefully maintained
      - fully armed and combat-tested
      - exploration and research refit still in progress
    visible_capabilities:
      - axial kinetic weapon
      - medium kinetic turrets
      - point-defense beam arrays
      - interceptor and anti-ship missiles
      - engineering repair and sampling systems
      - modular labs, probe racks, isolation modules, distributed data storage, radiation and dust protection
    excluded_facts:
      - in-world proper fleet name
      - exact vessel count
      - ship names
      - crew roster
      - departure date
  SYS_0007:
    origin: old_federation_technology
    organization_role: major-corporation_employee_benefit
    observable_function:
      - rapidly writes reviewed knowledge, related memories, and trained instincts through neural instruction
    listed_risks:
      - memory blending
      - temporal disorientation
      - self-recognition drift
      - short-term personality overlay
      - dream contamination
      - memories experienced as not one's own
    unresolved:
      - engineering mechanism
      - long-term success rate
      - source identity of course memories
  SYS_0008:
    stable_author_facts:
      - current Andromeda AI normally exists as a physically bounded core
      - cores are classified from level five to level one
      - a level-five core can reduce a colony's bureaucratic staffing need by about 60 percent
      - each step from level five toward level one increases capability by roughly one order of magnitude
      - corporations deploy specialist oversight to monitor intelligence, data breadth, and data depth
      - strict oversight responds to an Old Federation AI rebellion that nearly spread across the federation and to Andromeda's sparse, dispersed geography
    reveal_constraints:
      - rebellion cause, actors, detailed chronology, and resolution remain undefined
      - no current rogue core is established
  ITEM_0001:
    physical_form: regulated_level_two_ai_core
    operator: FAC_0001
    function: relic-related anomaly modeling
    output_truth_layer: L3_ORGANIZATION_MODEL
    restrictions:
      - registered
      - isolated
      - monitored by designated specialists
      - FAC_0001 employees are told not to discuss philosophy with it
    current_model:
      - suspected anomaly may erase information associated with an encounter rather than merely destroy a ship
      - CHR_0001's return should have fallen within that effect if the model is correct
      - the 92.7 percent return-structure integrity result is incompatible with the current accident model
    objective_validity: UNRESOLVED

knowledge_measurement_clarification:
  subject: CHR_0001
  metric: return_structure_integrity
  value_percent: 92.7
  means: structural agreement between returned result and retained corporate baseline
  does_not_mean:
    - percentage of autobiographical life that can be actively recalled
    - proof that inaccessible content remains intact
    - proof that memories originally belonged to the current subject
    - proof of objective identity continuity

