    status: AUTHOR_APPROVED
    approved_at: 2026-08-16
  summary:
    - CHR_0005 leaves LOC_0008 after midnight because he must return to FAC_0008 for work the next day
    - CHR_0001, CHR_0003, and CHR_0004 close the evening with household tasks, local news, and ordinary neighborhood updates
    - an old towel and CHR_0001's former bedroom intensify familiar-but-not-fully-owned autobiographical experience without resolving identity continuity
    - CHR_0001 falls asleep unusually quickly and experiences a subjective dream involving an old spaceport, distorted broadcast, a vast well-like structure, silver-white flows, and unclassifiable fragments
    - CHR_0001 subjectively names the dream structure SYS_0003, but neither the name nor the dream certifies objective mechanism, communication, memory, prophecy, or facility activity
    - the chapter ends inside the dream when CHR_0003's voice calls CHR_0001's name; no waking event occurs

character_changes:
  CHR_0001:
    location:
      before: LOC_0008
      after: LOC_0008
    offer_state:
      before: personally inclined to accept; formal acceptance, employment, training, and departure pending
      after: unchanged
    physical_state:
      - accumulated fatigue becomes strongly apparent after the household settles for the night
      - falls asleep rapidly in his former bedroom; whether this speed has any external cause remains unresolved
    psychological_state:
      - choosing between a newly prepared towel and his old towel intensifies the separation between remembered familiarity and felt ownership
      - recognizes household details and autobiographical associations while still experiencing them as partly belonging to another person
      - experiences a disturbing but unverified cognition dream associated in his mind with SYS_0003
    subjective_dream_experience:
      - begins in a silent version of a childhood spaceport with missing reflection and distorted environmental rules
      - hears a nonlinguistic low-frequency pattern that he can only describe as a call
      - experiences a vast well-like structure, shifting scale, silver-white flows, and unclassifiable fragments resembling people, places, and ships
      - subjectively identifies the structure as SYS_0003 without knowing why
      - hears CHR_0003 call his name across the dream before the chapter ends
    knowledge_boundary:
      - does not know whether the dream had an external trigger
      - cannot classify the fragments as memories, personalities, records, history, or imagination
      - does not gain objective knowledge of SYS_0003's origin, mechanism, physical form, or relation to clone-pilot technology
      - does not know whether CHR_0003's final call is external reality or part of the dream
    explicitly_not_resolved:
      - objective identity continuity
      - cause of rapid sleep or the dream
      - whether the dream contains authentic memory, communication, prediction, or facility activity
      - formal acceptance of FAC_0001's offer
  CHR_0003:
    location: LOC_0008
    chapter_actions:
      - finishes kitchen cleanup and participates in fragmented family discussion of local life
      - retrieves CHR_0001's old washing items and urges him to sleep
      - calls CHR_0001's name at the dream's end, with the source layer left unconfirmed
    knowledge_boundary:
      - receives no information about the dream, identity anomaly, resurrection mechanism, destination, or classified technology
  CHR_0004:
    location: LOC_0008
    chapter_actions:
      - watches the local news terminal and discusses nearby work, maintenance, and neighborhood changes
      - joins the ordinary parental exchange before the household goes to sleep
    knowledge_boundary:
      - receives no information about the dream, identity anomaly, resurrection mechanism, destination, or classified technology
  CHR_0005:
    location:
      before: LOC_0008
      after: outside LOC_0008 and returning home by the neighborhood street; destination not established
    chapter_actions:
      - leaves after midnight because of his next FAC_0008 shift
      - extinguishes one cigarette before departure
    durable_state_boundary:
      - this single observed action does not establish a smoking habit, dependency, frequency, or inventory
      - the future spaceport invitation remains active but unexecuted

