world_changes:
  LOC_0005:
    stable_author_facts:
      - designated K-12 and known as Novar
      - old-federation terraformed colony whose planetary transformation remains incomplete
      - lies in a comparatively distant orbital band and uses orbital beam lights to assist climate and illumination
      - has human-breathable modified atmosphere and a broadly Earth-compatible biosphere
      - native high-oxygen evolutionary background contributed to unusually large native organisms
      - aggressive native ecosystems remain outside secure settlement zones
      - inhabited belts experience persistent atmospheric disturbance, most visibly wind
    unresolved:
      - exact orbit, oxygen ratio, day length, beam-light count and power, and complete ecological taxonomy
  SYS_0011:
    stable_author_facts:
      - orbital beam lights supplement natural illumination and climate management on LOC_0005
    unresolved:
      - engineering origin, operator, topology, count, and operating schedule
  FAC_0001:
    current_positions:
      - says CHR_0001 may leave and remains personally free
      - says existing debt remains valid and some long-range permits may face restrictions
      - publicly reports CHR_0001 as recovered after seven months of deep-space loss
      - temporarily restricts resurrection-related medical records
      - opens provisional housing, a cancellable teaching assessment, and limited fleet-material access
    boundary:
      - these are company or institutional positions, not a complete legal model

