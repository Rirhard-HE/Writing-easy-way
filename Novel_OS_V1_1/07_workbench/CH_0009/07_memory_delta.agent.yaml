chapter_changes:
  title:
    proposed: 前途无量
    status: AUTHOR_APPROVED
  prose:
    status: AUTHOR_APPROVED
    approved_at: 2026-08-16
  summary:
    - CHR_0003 adds a small hot dish while CHR_0005 jokes about FAC_0008 synthetic meals and automated farming
    - CHR_0005's limited recognition leads into the broader contrast between core colonies near former main routes and edge worlds such as LOC_0005
    - CHR_0004 reveals an academy incident in which CHR_0001's old identity disabled a training craft safety speed limit to prove a manual descent plan
    - unmanned target craft performed emergency avoidance, one navigation-array group was damaged, training airspace closed temporarily, nobody was injured, and the old identity nearly lost academy enrollment
    - family teasing, shared memories, food, and ordinary household tasks reduce CHR_0001's immediate sense of suspension without resolving objective identity continuity
    - CHR_0005 asks about FAC_0002, hears that CHR_0001 remains only a conditional candidate, and separates an observable rise in corporate relic projects from unverified mortality hearsay
    - a childhood memory of watching shuttles leads CHR_0005 to invite CHR_0001 to visit a nearby spaceport after the rain; no travel occurs

character_changes:
  CHR_0001:
    location:
      before: LOC_0008
      after: LOC_0008
    offer_state:
      before: personally inclined to accept; formal acceptance, employment, training, and departure pending
      after: unchanged; describes himself as an external or peripheral candidate without formal staffing status
    old_identity_history:
      - attended a flight academy before later fleet service
      - during one training exercise, disabled a safety speed limit to demonstrate a faster manual descent plan
      - forced several unmanned target craft into emergency avoidance, damaged one navigation-array group, and caused temporary training-airspace closure
      - no one was injured; the old identity nearly lost academy enrollment
    psychological_state:
      - familiar argument, food, family teasing, and practical plans temporarily reduce the sense of being suspended between two lives
      - identity uncertainty remains present and unresolved
      - begins considering an ordinary household repair before the next-day family meal
    knowledge_gained:
      - recognizes the core-edge development and credential gap from personal travel and CHR_0005's experience
      - hears that many companies are visibly increasing relic-project recruitment or announcements
      - knows CHR_0005 has heard unverified claims of rising relic-project deaths but has no official statistics
    relationship_update:
      - remembers asking CHR_0005 about his dream while they watched shuttle operations as children
      - accepts CHR_0005's invitation to visit a nearby spaceport after the rain, without setting a date or leaving LOC_0008
    explicitly_not_resolved:
      - objective ownership of the academy memory or continuity with the pre-awakening identity
      - formal acceptance of FAC_0001's offer
      - cause, scale, source network, or mortality of the relic-project expansion
  CHR_0003:
    location: LOC_0008
    chapter_actions:
      - adds a small hot dish and expresses concern about CHR_0005's work meals
      - joins the academy-incident teasing while retaining knowledge of its disciplinary seriousness
      - stops discussion of relic-project deaths at the table
    knowledge_boundary:
      - hears CHR_0005's unverified mortality claim and the public expansion trend
      - receives no resurrection, identity-anomaly, destination, or full-risk disclosure
  CHR_0004:
    location: LOC_0008
    chapter_actions:
      - shifts attention from CHR_0005's career problem by teasing CHR_0001 as a formerly promising pilot and current prospective explorer
      - recounts the approved flight-academy incident through family knowledge
    knowledge_boundary:
      - understands CHR_0001 still lacks formal relic-affairs staffing status
      - receives no resurrection, identity-anomaly, destination, or full-risk disclosure
  CHR_0005:
    location:
      before: LOC_0008
      after: LOC_0008
    current_state:
      employment: unchanged at FAC_0008
      career_context:
        - reports that core-colony experience receives greater recognition than comparable edge-world maintenance experience
        - remains frustrated by limited formal mobility and recognition; no promotion or new credential occurs
      relic_interest:
        - distinguishes public recruitment and project announcements from unverified mortality hearsay
        - says he wants to understand why systems work rather than being told that continued operation is sufficient
    knowledge_gained:
      - knows FAC_0002 is a core FAC_0001 department
      - knows CHR_0001 remains a conditional candidate without formal staffing status
      - knows no additional task destination, classified mechanism, resurrection fact, or complete risk information
    relationship_update:
      - shared childhood shuttle-watching and an unanswered dream question are recalled
      - invites CHR_0001 to watch shuttles at a nearby spaceport after the rain; no date or travel is established

