world_changes:
  SYS_0012:
    stable_author_facts:
      - core colonies located near former main routes tend to have denser automated industry
      - many major-corporation headquarters are concentrated in core colonies
      - edge worlds such as LOC_0005 more often supply raw materials and recruited people, including soldiers, pilots, and debt-bound labor
      - qualifications and experience from core regions may receive greater recognition than comparable edge-world experience, creating indirect discrimination
    structural_effects:
      - corporate headquarters, orders, qualifications, and professional networks reinforce opportunity concentration in core regions
      - edge worlds buy back higher-priced equipment and contracts while exporting resources and labor
    boundaries:
      - describes a broad pattern, not every colony, company, hiring decision, or individual outcome
      - does not establish a formal legal caste, complete trade system, exact prices, quotas, or universal discrimination policy
      - proximity to former main routes does not mean the pre-collapse intergalactic network remains operational
  FAC_0005:
    regional_structure_update:
      - contains economically differentiated core and edge colonies within its current political framework
      - formal political structure remains unchanged; new Federation is not established as a separate official name
  LOC_0005:
    regional_position:
      - functions as an edge world within SYS_0012
      - exports raw materials and recruited people while local experience may receive less recognition in core-region mobility
    boundary:
      - does not mean every resident, employer, shipment, or career follows the same pattern
  FAC_0008:
    personnel_context:
      - CHR_0005 reports that core-colony background can be favored for outside assignments over comparable edge-world maintenance experience
    boundary:
      - one employee account does not establish a universal FAC_0008 or federation-wide hiring rule
  relic_project_activity:
    confirmed_trend:
      - many companies have visibly increased relic-project recruitment, announcements, development, or adaptation work in recent years
      - projects may involve independently found relics or relic equipment and products obtained from elsewhere
    unresolved:
      - complete company list, project count, source routes, ownership, scale, causes, and commercial relationships
      - whether objective deaths are increasing
    rumor_layer:
      holder: CHR_0005
      claim: relic-project deaths have increased in recent years
      evidence_status: unverified hearsay without official statistics

