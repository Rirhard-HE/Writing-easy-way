chapter_changes:
  title:
    proposed: 真相？
    status: AUTHOR_APPROVED
  summary:
    - CHR_0002 explains that FAC_0001 has faced physical relic defenses up to battle-line unmanned fleets, while CHR_0001's anomaly remains exceptional in its verifiable records
    - CHR_0001 recognizes that FAC_0001 is sending him back because its model gives him a higher survival probability, not safety
    - ITEM_0001 analysis highlights one active sample among several inaccessible return-structure regions without identifying its content or origin
    - FAC_0001 archives attribute a five-year border-fleet career, the LOC_0004 refusal incident, ITEM_0002 ownership, and repeated survival record to CHR_0001's old identity
    - FAC_0001 models the archived identity as broadly ordinary but unusually repeatedly survivable
    - CHR_0002 presents the collapse of SYS_0009 at T-527, roughly three centuries of fragmentation, and a present stable exploration scope of thirty macro-regions
    - CHR_0002 presents FAC_0005 as a formal shell whose institutions coexist with major-corporation practical power
    - CHR_0002 explains modern dependence on recovered human relic technology and reveals FAC_0006 / LOC_0003 as an important teaching-technology source opened at T-214

character_changes:
  CHR_0001:
    location: LOC_0001_CORPORATE_BRIEFING_ROOM
    physical_state:
      change: NONE_MATERIAL
      retained:
        - residual right-leg weakness
        - temporary metered medical support rod
    offer_state:
      before: has received but not accepted a conditional expedition and candidate-member offer
      after: unchanged; still considering after receiving additional risk, personal-archive, and civilization-history context
    archive_attributions_learned:
      - company records attribute five years as a tactical pilot in the Seventh Patrol Group of the Federation Border Fleet to his old identity
      - records attribute discharge for refusing an orbital-strike order against LOC_0004 due to reported civilian presence
      - records attribute liquidation of service assets, transport craft, outer-ring property, pension, and parental savings to purchase and refit ITEM_0002
      - records attribute cargo, escort, deep-space recovery, border contraband-clearing work, thirteen major hull-damage incidents, seven oxygen-loss incidents, two jump failures, and one cockpit penetration
      - company model classifies the archived identity as stable, standard intelligence, medium-high risk, typical border pilot, broadly ordinary, with an informal note of extreme repeated survivability
    knowledge_gained:
      - FAC_0001 verifiable relic records include automated physical defenses up to battle-line unmanned fleet scale
      - people and ships encountering similar anomalies may simply have failed to return; this is an inference, not a complete archive
      - FAC_0001 considers him statistically more likely than an unrelated explorer to return useful information, without guaranteeing survival
      - one sample among existing inaccessible return-structure regions shows repeated activity but no stable read path
      - SYS_0009 once linked the Milky Way, Andromeda, and the Small Magellanic Cloud
      - SYS_0005 occurred 527 years ago and was followed by roughly three centuries of fragmentation and technological loss
      - thirty macro exploration regions in Andromeda's outer arm are currently maintained within a stable exploration system
      - FAC_0005 formal institutions persist while corporations control much practical transport, supply, fleet, and legal influence
      - modern civilization depends heavily on recovered and reverse-engineered human relic technology
      - FAC_0006 was an Old Federation education company and LOC_0003 was opened by a FAC_0001 predecessor 214 years ago
    psychological_state:
      - experiences immediate fear at the possibility of an observing anomaly making a choice
      - feels involuntary moral and emotional reactions to LOC_0004, parental savings, and ITEM_0002 without recovering a complete memory
      - understands the expedition as both a likely death mission and a possible civilizational recovery opportunity
    explicitly_not_resolved:
      - whether the archived military and ship history objectively belongs to the current subject
      - content, origin, or cause of inaccessible return-structure regions
      - objective exceptional ability or survival mechanism
      - whether any target observed, selected, or spared him
      - whether he will accept the offer
  CHR_0002:
    demonstrated_knowledge:
      - FAC_0001 relic-exploration archive and its record limits
      - ITEM_0001 inaccessible-region analysis
      - CHR_0001 old-identity archive and company personality model
      - broad history of SYS_0009, SYS_0005, SYS_0010, FAC_0005, FAC_0006, and LOC_0003
    address_change:
      - speaks CHR_0001's name with a less archival tone; not the first use of the name and not a confirmed intimacy change
    knowledge_ceiling:
      - does not certify current identity continuity
      - does not know inaccessible-region content or origin
      - keeps observation, erasure, selection, and restraint as ITEM_0001/FAC_0001 models
      - distinguishes LOC_0003 from the current unknown relic

relationship_changes:
  CHR_0001__CHR_0002:
    latest_interaction:
      - CHR_0002 discloses additional restricted personal archive and civilization-history context
