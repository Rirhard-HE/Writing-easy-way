    trust_change: NONE_CONFIRMED
    alliance_change: NONE_CONFIRMED
    intimacy_change: NONE_CONFIRMED

world_changes:
  SYS_0005:
    age_years: 527
    chronology:
      - occurs at approximately T-527
      - intergalactic main routes fail and Andromeda loses contact with the Milky Way and other external Old Federation regions
      - cause remains unknown
    does_not_mean:
      - every internal Andromeda gate ceased functioning
      - relics or anomalies caused the collapse
  SYS_0009:
    stable_author_facts:
      - Old Federation humans had a stable intergalactic gate-route network
      - the network connected at least the Milky Way, Andromeda, and the Small Magellanic Cloud
      - superluminal communication supported cross-galaxy data synchronization
    unresolved:
      - engineering mechanism
      - full network extent
      - exact node count and topology
  SYS_0010:
    stable_author_facts:
      - gate-network convenience encouraged extreme colonial specialization
      - after network fragmentation, some colonies lacked food, industrial, ecological, or life-support self-sufficiency
      - broad fragmentation, war, famine, warlordism, and technology loss lasted roughly the first three centuries after SYS_0005
      - current civilization maintains stable exploration across thirty macro-regions in Andromeda's outer arm
      - recovered human relic archives, devices, and reverse engineering are major contributors to modern technological recovery
    archive_examples:
      - an unnamed cold research colony used planetary climate for computation cooling and relied on gates for external supplies
      - after supply failure, surviving groups fought over limited resources
    boundaries:
      - not every specialized colony collapsed or fought to extinction
      - the thirty regions are macro exploration units, not individual systems or colonies
      - specialization failure is one major source of abandoned facilities, not the origin of every relic
  FAC_0005:
    stable_author_facts:
      - retains formal fleets, military tribunals, taxation, laws, and interregional agreements
      - major-corporation consortiums control much practical fleet capacity, colonial supply, route access, and rule-drafting influence
    political_model:
      - CHR_0002 describes the federation as a shell that coordinates arms, taxation, and minimum shared order
    unresolved:
      - complete constitution
      - membership and voting system
      - universal ownership status of fleets, colonies, or people
  FAC_0006:
    identity:
      - Old Federation human education company
      - producer of teaching devices, course payloads, and supporting neural interfaces
    slogan: 让知识不再受时间限制
    relationship_to_modern_technology:
      - materials recovered from LOC_0003 became one important source for restoration of modern neural teaching technology
    boundaries:
      - not the sole origin of modern recovery
      - not established as creator of SYS_0003 or all modern AI
  LOC_0003:
    stable_author_facts:
      - historical FAC_0006 site in the broad LOC_0002 region
      - opened by a predecessor of FAC_0001 at approximately T-214
      - contained human-standard language, interfaces, logic, documents, and working technology
    distinction:
      - not identified with the currently unknown relic sought through CHR_0001's residual route
      - not established as the physical body or sole source of SYS_0003
  LOC_0004:
    stable_archive_facts:
      - colonial habitat named Hera-3
      - archived military record says civilians remained inside when an orbital-strike order was issued
      - archived old identity attributed to CHR_0001 refused the order and lost military status
    unresolved:
      - conflict parties
      - legality and motivation of the strike order
      - actual civilian outcome
      - broader campaign result
  ITEM_0002:
    observable_archive_description:
      - old narrow patched ship with early-model propulsion structures and worn white name lettering
      - acquired and refitted through total asset liquidation, family funds, illegal-refit loans, high-interest deep-space insurance, and tactical-module installments
      - FAC_0001 archive links ITEM_0002 to the existing SYS_0001 accident/log record
    ownership_truth_boundary:
      - archived old identity ownership is text-confirmed through FAC_0001 records
      - current-subject objective ownership and identity continuity remain unresolved
  FAC_0001:
    relic_archive:
      - verifiable records include automated unmanned physical defenses up to battle-line fleet scale
      - the archive cannot represent expeditions that returned no information
    civilization_role:
      - predecessor opened LOC_0003 at T-214
      - uses recovered and reverse-engineered relic technology while retaining black-box limits
  SYS_0003:
    chapter_clarification:
      - black cube shown in CH_0004 is FAC_0001's internal project icon, not proof of a single physical machine
      - cited as an example of a key technology chain partly callable and maintainable but not fully understood or reproducible
    unchanged_objective_boundary:
      - origin, ontology, complete mechanism, and single physical referent remain unresolved
  SYS_0007:
    origin_clarification:
      - LOC_0003/FAC_0006 material became an important source for modern restoration
      - FAC_0006 is not established as the only source of all teaching-device implementations
  SYS_0008:
    origin_clarification:
      - modern AI frameworks broadly incorporate relic reverse-engineering results from multiple sources
      - ITEM_0001 core design and all AI origins are not disclosed
  ITEM_0001:
    current_model_update:
      - selects one active sample from multiple inaccessible return-structure regions
      - sample repeatedly produces activity but stable read paths fail
    objective_validity: UNRESOLVED

