      - SYS_0005 是仙女座航区公共历史，其原因仍不明
      - 一份身份密钥与其旧档案一致的损坏日志声称发现大崩裂前设施，且发送者称能再次找到
      - 主角舰船推定毁灭坐标没有符合舰船毁灭的物理证据
      - FAC_0001 把该证据异常称为 SYS_0006，但明确未证明机制
      - FAC_0003 舰队残骸表现出高温熔化与直接撕裂两类异常毁损，且无可确认幸存者
      - 本次特殊项目邀约源于异常事故、日志和潜在遗迹价值
    explicitly_does_not_know:
      - 日志发送者与当前自己的客观身份连续性
      - 遗迹坐标、性质与再次定位方法
      - SYS_0006 是否对应真实机制、抹除对象或影响范围
      - 主角舰船去向及 FAC_0003 舰队毁损原因
      - 上述异常与 SYS_0003、白光、遗迹之间的客观因果
  CHR_0002:
    demonstrates_or_claims:
      L3_ORGANIZATION_MODEL:
        - 熟悉 FAC_0002 组织职能、日志校验、搜索记录、残骸记录和临时授权
        - 把证据缺失归为 SYS_0006 项目工作标签
